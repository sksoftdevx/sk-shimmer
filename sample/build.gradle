plugins { id 'com.android.application' }

android {
    namespace 'com.sksoftdev.skshimmer.sample'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sksoftdev.skshimmer.sample'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies { implementation project(':skshimmer') }
